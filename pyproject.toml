[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tersena-engine"
version = "0.1.0"
description = "Curated Tersena parsing and matching engine with synthetic examples"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tersena-demo = "tersena.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
